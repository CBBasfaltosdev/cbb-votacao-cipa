<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Eleição CIPA — cbb Asfaltos</title>
    <script type="text/javascript">
      // GitHub Pages não tem servidor para reescrever rotas de SPA — qualquer caminho que
      // não seja um arquivo real cai aqui. Redireciona para index.html preservando o
      // caminho pedido, que o script em index.html devolve para o histórico do navegador.
      var pathSegmentsToKeep = 1 // mantém "/cbb-votacao-cipa"
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
